actor: Tester
bootstrap: _bootstrap.php
paths:
  tests: tests
  output: tests/_output
  data: tests/_data
  support: tests/_support
  envs: tests/_envs
settings:
  colors: true
  error_level: "E_ALL & ~E_STRICT & ~E_DEPRECATED & ~E_USER_DEPRECATED"
  memory_limit: 1024M
extensions:
  enabled:
    - Codeception\Extension\RunFailed
params:
  - tests/_craft/.env
modules:
  config:
    \craft\test\Craft:
      configFile: 'tests/_craft/config/test.php'
      entryUrl: 'http://plugins.nitro/index.php'
      projectConfig: {}
      migrations: []
      plugins:
        feedme:
          class: '\craft\feedme\Plugin'
          handle: feed-me
      cleanup: true
      transaction: true
      dbSetup: {clean: true, setupCraft: true}
      fullMock: false
